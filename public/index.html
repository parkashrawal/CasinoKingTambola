<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>नम्बर मेला</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<h1>🎯 नम्बर मेला</h1>

<!-- ===== पहिलो पेज ===== -->
<div id="landing" class="card">
  <h2>स्वागत छ!</h2>
  <button onclick="showHostLogin()">🎩 होस्ट लगइन (रुम बनाउन)</button>
  <hr>
  <button onclick="viewGame()">👀 खेल हेर्नुहोस्</button>
  <div id="landingMsg" class="msg"></div>
</div>

<!-- ===== होस्ट लगइन ===== -->
<div id="hostLoginBox" class="card" style="display:none">
  <h2>🎩 होस्ट लगइन</h2>
  <input id="hostPassword" placeholder="होस्ट पासवर्ड" type="password">
  <button onclick="hostLogin()">लगइन गर्नुहोस्</button>
  <button onclick="backToLanding()" style="background:rgba(255,255,255,0.2);color:#fff">← फिर्ता</button>
  <div id="hostLoginMsg" class="msg"></div>
</div>

<!-- ===== टिकट बनाउने ===== -->
<div id="ticketSetup" class="card" style="display:none">
  <h2>✏️ खेलाडीहरूको नाम लेख्नुहोस्</h2>
  <p>कम्तीमा २ जना, बढीमा १५ जना</p>
  <div id="nameInputs"></div>
  <button onclick="startGameWithNames()">🎮 गेम सुरु गर्नुहोस्</button>
  <div id="setupMsg" class="msg"></div>
</div>

<!-- ===== खेल स्क्रिन ===== -->
<div id="game" style="display:none">

  <div class="winner-banner">
    <div class="winner-item">
      <span class="winner-label">🏆 फुल हाउस (विजेता):</span>
      <span class="winner-name" id="fullWinnerName">--</span>
    </div>
    <div class="winner-item">
      <span class="winner-label">🥈 कर्नर (दोस्रो):</span>
      <span class="winner-name" id="cornerWinnerName">--</span>
    </div>
  </div>

  <div class="card">
    <h3>📋 नम्बर बोर्ड (१-९९)</h3>
    <div id="numberBoard" class="number-board"></div>
  </div>

  <div class="card">
    <div class="top-bar">
      <div>नम्बर: <b id="currentNumber">--</b></div>
    </div>
    <div class="host-panel" id="hostPanel" style="display:none">
      <button onclick="callNumber()">नम्बर कल गर्नुहोस्</button>
      <button onclick="autoToggle()" id="autoBtn">अटो: बन्द</button>
    </div>
    <div id="gameMsg" class="msg"></div>
    <h3>निकालिएका नम्बरहरू</h3>
    <div id="calledList" class="called-list"></div>
  </div>

  <div class="card">
    <h3>सबै खेलाडीका टिकट</h3>
    <div id="allTickets"></div>
  </div>

</div>

<script src="/socket.io/socket.io.js"></script>
<script src="script.js"></script>
</body>
</html>
