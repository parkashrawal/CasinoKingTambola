<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>नम्बर मेला</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<h1>🎯 नम्बर मेला</h1>

<div id="lobby" class="card">
  <h2>खेलमा सामेल हुनुहोस्</h2>
  <input id="playerName" placeholder="तपाईंको नाम" maxlength="15">

  <button onclick="showHostLogin()">🎩 होस्ट लगइन (रुम बनाउन)</button>

  <div id="hostLogin" style="display:none">
    <input id="hostPassword" placeholder="होस्ट पासवर्ड" type="password">
    <button onclick="createRoom()">नयाँ रुम बनाउनुहोस्</button>
  </div>

  <hr>
  <h3>वा रुम जोडिनुहोस्</h3>
  <input id="roomCode" placeholder="रुम कोड" maxlength="4" style="text-transform:uppercase">
  <button onclick="joinRoom()">रुम जोडिनुहोस्</button>
  <div id="lobbyMsg" class="msg"></div>
</div>

<div id="waiting" class="card" style="display:none">
  <h2>रुम कोड: <span id="roomCodeDisplay"></span></h2>
  <p>यो कोड साथीहरूलाई पठाउनुहोस्</p>
  <h3>खेलाडीहरू (<span id="playerCount">0</span>/15)</h3>
  <ul id="playerList"></ul>
  <button id="startBtn" onclick="startGame()" style="display:none">गेम सुरु गर्नुहोस्</button>
  <div id="waitMsg" class="msg"></div>
</div>

<div id="game" style="display:none">

  <div class="card">
    <h3>📋 नम्बर बोर्ड (१-९९)</h3>
    <div id="numberBoard" class="number-board"></div>
  </div>

  <div class="card">
    <div class="top-bar">
      <div>रुम: <b id="gameRoomCode"></b></div>
      <div>नम्बर: <b id="currentNumber">--</b></div>
    </div>
    <div class="host-panel" id="hostPanel" style="display:none">
      <button onclick="callNumber()">नम्बर कल गर्नुहोस्</button>
      <button onclick="autoToggle()" id="autoBtn">अटो: बन्द</button>
    </div>
    <h3>तपाईंको टिकट</h3>
    <div id="myTicket" class="ticket"></div>

    <div class="claim-buttons">
      <button onclick="claim('corner')" id="cornerBtn">🥈 कर्नर (४ कुना)</button>
      <button onclick="claim('full')" id="fullBtn">🏆 फुल हाउस</button>
    </div>

    <div id="gameMsg" class="msg"></div>

    <h3>निकालिएका नम्बरहरू</h3>
    <div id="calledList" class="called-list"></div>
  </div>

  <div class="card">
    <h3>सबै खेलाडीका टिकट</h3>
    <div id="allTickets"></div>
  </div>

</div>

<script src="/socket.io/socket.io.js"></script>
<script src="script.js"></script>
</body>
</html>
